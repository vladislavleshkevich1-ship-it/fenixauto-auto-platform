name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fenixauto
          POSTGRES_USER: fenixauto
          POSTGRES_PASSWORD: fenixauto_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fenixauto -d fenixauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Initialize database
        env:
          PGPASSWORD: fenixauto_dev
        run: psql -h localhost -U fenixauto -d fenixauto -f database/schema.sql && psql -h localhost -U fenixauto -d fenixauto -f database/seed.sql
      - name: API import check
        env:
          DATABASE_URL: postgresql://fenixauto:fenixauto_dev@localhost:5432/fenixauto
        run: python -c "from backend.app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
